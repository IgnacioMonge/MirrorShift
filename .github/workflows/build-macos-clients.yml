name: Build macOS clients

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.10.3

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build and test
        run: |
          make client-test \
            CLIENT_CMAKE_BUILD_DIR="build/qt-client-${{ matrix.arch }}" \
            CLIENT_CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0"

      - name: Package application
        run: |
          app_dir="$RUNNER_TEMP/mirrorshift-${{ matrix.arch }}"
          version="$(tr -d '\r\n' < VERSION)"
          archive="release/Qt/MirrorShift-${version}-macOS-${{ matrix.arch }}.zip"

          make client \
            CLIENT_CMAKE_BUILD_DIR="build/qt-client-${{ matrix.arch }}" \
            CLIENT_CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0" \
            CLIENT_MAC_APPLICATIONS_DIR="$app_dir"

          test "$(lipo -archs "$app_dir/MirrorShift.app/Contents/MacOS/MirrorShift")" = "${{ matrix.arch }}"
          mkdir -p release/Qt
          ditto -c -k --sequesterRsrc --keepParent "$app_dir/MirrorShift.app" "$archive"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MirrorShift-${{ matrix.arch }}-macOS
          path: release/Qt/MirrorShift-*-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
